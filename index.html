<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Reveal Game</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-front: #1e293b;
            --card-back: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 2rem; font-weight: 300; letter-spacing: 2px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            perspective: 1000px;
        }

        .tile {
            width: 100px;
            height: 100px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tile.flipped {
            transform: rotateY(180deg);
        }

        .tile-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tile-front {
            background-color: var(--card-front);
            border: 2px solid #334155;
        }

        .tile-front:hover {
            background-color: #334155;
        }

        .tile-back {
            background-color: var(--card-back);
            color: #0f172a;
            transform: rotateY(180deg);
            font-size: 1.1rem;
        }

        .tile-back.empty {
            background-color: #475569;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>Find the Names</h1>
    <div class="grid" id="grid"></div>

    <script>
        const names = ['Erik', 'Stella', 'Marta'];
        const totalTiles = 16; // 4x4 grid
        
        // Create an array with names and empty strings
        let tileContent = [...names];
        while (tileContent.length < totalTiles) {
            tileContent.push('');
        }

        // Shuffle the array (Fisher-Yates)
        for (let i = tileContent.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tileContent[i], tileContent[j]] = [tileContent[j], tileContent[i]];
        }

        const gridElement = document.getElementById('grid');

        // Create the tiles
        tileContent.forEach((content) => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            
            tile.innerHTML = `
                <div class="tile-face tile-front">?</div>
                <div class="tile-face tile-back ${content === '' ? 'empty' : ''}">
                    ${content || '—'}
                </div>
            `;

            tile.addEventListener('click', () => {
                tile.classList.toggle('flipped');
            });

            gridElement.appendChild(tile);
        });
    </script>
</body>
</html>
